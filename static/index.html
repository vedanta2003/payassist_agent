<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PayAssist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
         :root {
            --bg: #0b0b0d;
            --panel: #131318;
            --panel-2: #181820;
            --border: #26262e;
            --border-2: #33333d;
            --text: #e8e8ea;
            --text-dim: #8b8b95;
            --text-mute: #5a5a64;
            --accent: #f59e0b;
            /* amber — PayAssist brand */
            --accent-d: #d97706;
            --user: #60a5fa;
            --agent: #34d399;
            --tool: #fbbf24;
            --api: #a78bfa;
            --state: #22d3ee;
            --error: #f87171;
            --info: #6b7280;
            --session: #ec4899;
        }
        
        * {
            box-sizing: border-box;
        }
        
        html,
        body {
            height: 100%;
            margin: 0;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Manrope', system-ui, sans-serif;
            font-size: 14px;
            line-height: 1.55;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        /* ── Layout ──────────────────────────────────────── */
        
        .app {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 56px 1fr;
            grid-template-areas: "header header" "chat   logs";
            height: 100vh;
        }
        
        header.app-header {
            grid-area: header;
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
            gap: 16px;
        }
        
        .brand {
            font-family: 'Instrument Serif', serif;
            font-size: 26px;
            font-style: italic;
            letter-spacing: 0.01em;
            color: var(--text);
        }
        
        .brand .dot {
            color: var(--accent);
            font-style: normal;
        }
        
        .tag {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-mute);
            border: 1px solid var(--border-2);
            padding: 3px 8px;
            border-radius: 3px;
        }
        
        .header-spacer {
            flex: 1;
        }
        
        .session-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-dim);
        }
        
        .session-pill .dot-status {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-mute);
            transition: background 0.3s;
        }
        
        .session-pill.connected .dot-status {
            background: var(--agent);
        }
        
        .session-pill.error .dot-status {
            background: var(--error);
        }
        
        .reset-btn {
            background: transparent;
            border: 1px solid var(--border-2);
            color: var(--text-dim);
            font-family: inherit;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .reset-btn:hover {
            color: var(--text);
            border-color: var(--accent);
        }
        /* ── Chat panel ──────────────────────────────────── */
        
        .chat-panel {
            grid-area: chat;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            border-right: 1px solid var(--border);
            overflow: hidden;
        }
        
        .chat-meta {
            padding: 12px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: baseline;
            gap: 12px;
        }
        
        .chat-meta h2 {
            font-family: 'Instrument Serif', serif;
            font-weight: 400;
            font-size: 18px;
            margin: 0;
            color: var(--text-dim);
        }
        
        .test-accounts {
            margin-left: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-mute);
        }
        
        .test-accounts strong {
            color: var(--text-dim);
            font-weight: 500;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .messages::-webkit-scrollbar {
            width: 8px;
        }
        
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .messages::-webkit-scrollbar-thumb {
            background: var(--border-2);
            border-radius: 4px;
        }
        
        .msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.55;
            animation: msg-in 0.25s ease-out;
        }
        
        @keyframes msg-in {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .msg.user {
            align-self: flex-end;
            background: var(--accent);
            color: #1a1206;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }
        
        .msg.agent {
            align-self: flex-start;
            background: var(--panel);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            color: var(--text);
        }
        
        .msg.thinking {
            align-self: flex-start;
            background: transparent;
            border: 1px dashed var(--border-2);
            color: var(--text-mute);
            font-style: italic;
            font-size: 13px;
        }
        
        .thinking-dots::after {
            content: '...';
            display: inline-block;
            animation: dots 1.4s infinite;
        }
        
        @keyframes dots {
            0%,
            20% {
                content: '.';
            }
            40% {
                content: '..';
            }
            60%,
            100% {
                content: '...';
            }
        }
        /* ── Composer ──────────────────────────────────── */
        
        .composer {
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            background: var(--panel);
        }
        
        .input-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        
        textarea {
            flex: 1;
            background: var(--panel-2);
            border: 1px solid var(--border-2);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            padding: 10px 12px;
            border-radius: 8px;
            resize: none;
            min-height: 40px;
            max-height: 120px;
            outline: none;
            transition: border-color 0.15s;
        }
        
        textarea:focus {
            border-color: var(--accent);
        }
        
        textarea::placeholder {
            color: var(--text-mute);
        }
        
        .send-btn {
            background: var(--accent);
            color: #1a1206;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
            height: 40px;
        }
        
        .send-btn:hover:not(:disabled) {
            background: var(--accent-d);
        }
        
        .send-btn:disabled {
            background: var(--border-2);
            color: var(--text-mute);
            cursor: not-allowed;
        }
        /* ── Logs panel ──────────────────────────────────── */
        
        .logs-panel {
            grid-area: logs;
            display: flex;
            flex-direction: column;
            background: var(--panel);
            overflow: hidden;
        }
        
        .logs-meta {
            padding: 12px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logs-meta h2 {
            font-family: 'Instrument Serif', serif;
            font-weight: 400;
            font-size: 18px;
            margin: 0;
            color: var(--text-dim);
        }
        
        .legend {
            margin-left: auto;
            display: flex;
            gap: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
        }
        
        .legend span {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-mute);
        }
        
        .legend span::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .legend .l-tool::before {
            background: var(--tool);
        }
        
        .legend .l-api::before {
            background: var(--api);
        }
        
        .legend .l-state::before {
            background: var(--state);
        }
        
        .logs {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            line-height: 1.6;
        }
        
        .logs::-webkit-scrollbar {
            width: 8px;
        }
        
        .logs::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .logs::-webkit-scrollbar-thumb {
            background: var(--border-2);
            border-radius: 4px;
        }
        
        .log-empty {
            color: var(--text-mute);
            font-style: italic;
            text-align: center;
            padding: 40px 20px;
            font-family: 'Instrument Serif', serif;
            font-size: 14px;
        }
        
        .log-entry {
            display: grid;
            grid-template-columns: 60px 60px 1fr;
            gap: 12px;
            padding: 4px 0;
            border-left: 2px solid var(--border-2);
            padding-left: 10px;
            margin-bottom: 2px;
            animation: log-in 0.2s ease-out;
        }
        
        @keyframes log-in {
            from {
                opacity: 0;
                transform: translateX(-4px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .log-entry .time {
            color: var(--text-mute);
        }
        
        .log-entry .kind {
            text-transform: uppercase;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.05em;
            align-self: center;
        }
        
        .log-entry .msg {
            color: var(--text);
            word-break: break-word;
            background: none;
            border: none;
            padding: 0;
            border-radius: 0;
            max-width: none;
            animation: none;
        }
        
        .log-entry.user {
            border-left-color: var(--user);
        }
        
        .log-entry.user .kind {
            color: var(--user);
        }
        
        .log-entry.agent {
            border-left-color: var(--agent);
        }
        
        .log-entry.agent .kind {
            color: var(--agent);
        }
        
        .log-entry.llm {
            border-left-color: var(--tool);
        }
        
        .log-entry.llm .kind {
            color: var(--tool);
        }
        
        .log-entry.api {
            border-left-color: var(--api);
        }
        
        .log-entry.api .kind {
            color: var(--api);
        }
        
        .log-entry.state {
            border-left-color: var(--state);
        }
        
        .log-entry.state .kind {
            color: var(--state);
        }
        
        .log-entry.session {
            border-left-color: var(--session);
        }
        
        .log-entry.session .kind {
            color: var(--session);
        }
        
        .log-entry.error {
            border-left-color: var(--error);
        }
        
        .log-entry.error .kind {
            color: var(--error);
        }
        
        .log-entry.info .kind {
            color: var(--info);
        }
        /* ── Responsive: stack on narrow screens ─────────── */
        
        @media (max-width: 900px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: 56px 1fr 240px;
                grid-template-areas: "header" "chat" "logs";
            }
            .chat-panel {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .test-accounts {
                display: none;
            }
            .legend {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="app-header">
            <div class="brand">PayAssist<span class="dot">.</span></div>
            <div class="tag">Demo</div>
            <div class="header-spacer"></div>
            <div class="session-pill" id="session-pill">
                <span class="dot-status"></span>
                <span id="session-id">connecting…</span>
            </div>
            <button class="reset-btn" id="reset-btn">New session</button>
        </header>

        <section class="chat-panel">
            <div class="chat-meta">
                <h2>Conversation</h2>
                <div class="test-accounts">
                    Try: <strong>ACC1001</strong> · <strong>ACC1002</strong> · <strong>ACC1003</strong> (₹0) · <strong>ACC1004</strong>
                </div>
            </div>
            <div class="messages" id="messages"></div>
            <div class="composer">
                <div class="input-row">
                    <textarea id="input" rows="1" placeholder="Try: 'Hi, my account is ACC1001 and I'm Nithin Jain'"></textarea>
                    <button class="send-btn" id="send-btn">Send</button>
                </div>
            </div>
        </section>

        <aside class="logs-panel">
            <div class="logs-meta">
                <h2>Agent activity</h2>
                <div class="legend">
                    <span class="l-tool">tool</span>
                    <span class="l-api">api</span>
                    <span class="l-state">state</span>
                </div>
            </div>
            <div class="logs" id="logs">
                <div class="log-empty">Activity will stream here as the agent works.</div>
            </div>
        </aside>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const messagesEl = $("messages");
        const logsEl = $("logs");
        const inputEl = $("input");
        const sendBtn = $("send-btn");
        const resetBtn = $("reset-btn");
        const sessionPill = $("session-pill");
        const sessionId = $("session-id");

        let SESSION_ID = null;
        let logsCleared = false;
        let evtSource = null;

        /* ── Rendering ─────────────────────────────── */
        function addMessage(role, text) {
            const div = document.createElement("div");
            div.className = "msg " + role;
            div.textContent = text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div;
        }

        function addThinking() {
            const div = document.createElement("div");
            div.className = "msg thinking";
            div.innerHTML = '<span class="thinking-dots">thinking</span>';
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div;
        }

        function addLog(entry) {
            if (!logsCleared) {
                logsEl.innerHTML = "";
                logsCleared = true;
            }
            const div = document.createElement("div");
            div.className = "log-entry " + (entry.kind || "info");
            div.innerHTML =
                `<span class="time">${entry.time || ""}</span>` +
                `<span class="kind">${entry.kind || "info"}</span>` +
                `<span class="msg"></span>`;
            div.querySelector(".msg").textContent = entry.msg || "";
            logsEl.appendChild(div);
            logsEl.scrollTop = logsEl.scrollHeight;
        }

        /* ── API calls ─────────────────────────────── */
        async function startSession() {
            sessionPill.className = "session-pill";
            sessionId.textContent = "connecting…";
            try {
                const r = await fetch("/session", {
                    method: "POST"
                });
                const d = await r.json();
                SESSION_ID = d.session_id;
                sessionPill.className = "session-pill connected";
                sessionId.textContent = SESSION_ID.slice(0, 8);
                messagesEl.innerHTML = "";
                addMessage("agent", d.message);
            } catch (e) {
                sessionPill.className = "session-pill error";
                sessionId.textContent = "offline";
                addMessage("agent", "Could not reach the server. Is uvicorn running?");
            }
        }

        async function sendMessage(text) {
            if (!SESSION_ID || !text.trim()) return;
            addMessage("user", text);
            sendBtn.disabled = true;
            inputEl.disabled = true;
            const thinking = addThinking();
            try {
                const r = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        session_id: SESSION_ID,
                        message: text
                    }),
                });
                const d = await r.json();
                thinking.remove();
                addMessage("agent", d.message);
            } catch (e) {
                thinking.remove();
                addMessage("agent", "Connection error — please try again.");
            } finally {
                sendBtn.disabled = false;
                inputEl.disabled = false;
                inputEl.focus();
            }
        }

        function startLogStream() {
            if (evtSource) evtSource.close();
            evtSource = new EventSource("/logs");
            evtSource.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data && data.msg) addLog(data);
                } catch {}
            };
            evtSource.onerror = () => {
                // SSE will auto-reconnect; we just note the state.
            };
        }

        /* ── Events ─────────────────────────────────── */
        inputEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                const v = inputEl.value;
                inputEl.value = "";
                inputEl.style.height = "auto";
                sendMessage(v);
            }
        });
        inputEl.addEventListener("input", () => {
            inputEl.style.height = "auto";
            inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
        });
        sendBtn.addEventListener("click", () => {
            const v = inputEl.value;
            inputEl.value = "";
            inputEl.style.height = "auto";
            sendMessage(v);
        });
        resetBtn.addEventListener("click", async() => {
            if (SESSION_ID) {
                try {
                    await fetch("/session/" + SESSION_ID, {
                        method: "DELETE"
                    });
                } catch {}
            }
            logsEl.innerHTML = '<div class="log-empty">Activity will stream here as the agent works.</div>';
            logsCleared = false;
            await startSession();
        });

        /* ── Boot ───────────────────────────────────── */
        startLogStream();
        startSession();
    </script>
</body>

</html>
